# Standalone production stack; does not merge with the local compose.yaml.
services:
  backend:
    image: ${INTEL_IMAGE:?Set an immutable application image digest}
    environment:
      INTEL_SECURE_COOKIES: "1"
      INTEL_TRUSTED_PROXIES: "172.30.87.2/32"
      INTEL_SETUP_TOKEN: ${INTEL_SETUP_TOKEN:-}
      INTEL_GUEST: ${INTEL_GUEST:-off}
    volumes:
      - intel-data:/app/data
    networks:
      app:
        ipv4_address: 172.30.87.3
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      start_period: 15s
      start_interval: 1s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    environment:
      DOMAIN: ${DOMAIN:?Set your public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set your certificate contact email}
    ports:
      - "${INTEL_BIND_ADDRESS:-0.0.0.0}:${INTEL_HTTP_PORT:-80}:80"
      - "${INTEL_BIND_ADDRESS:-0.0.0.0}:${INTEL_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      app:
        ipv4_address: 172.30.87.2
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.87.0/24

volumes:
  intel-data:
  caddy-data:
  caddy-config:
