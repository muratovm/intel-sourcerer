<div class="topic-article">
  <span class="topic-article-date">${date}</span>
  <div>
    <a class="topic-article-title" href="${link}">${title}</a>
    <p class="muted">${meta}</p>
    ${note}
  </div>
  <button type="button" class="tag-remove" data-remove="${url}" aria-label="${remove_label}">×</button>
</div>
