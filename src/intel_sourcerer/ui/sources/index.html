<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf-token" content="${csrf_token}" />
    <script src="/sources.js" defer></script>
    <title>Sources · Intel Sourcerer</title>
    <link rel="stylesheet" href="/reader.css" />
  </head>
  <body>
    <main class="sources-page">
      <!-- header: /sources -->
      <div class="sources-hero">
        <div class="sources-title-row">
          <div class="sources-heading">
            <h1>Sources</h1>
            <p class="sources-summary">
              <span class="sources-enabled-pill">${enabled_count} enabled</span>
              <span aria-hidden="true">·</span>
              <span>${source_count} configured</span>
              ${config_badge}
            </p>
          </div>
          <div class="sources-check-all" role="region" aria-label="Check all sources for new articles">
            <label class="sources-lookback" for="check-all-days">
              <span>Look back</span>
              <select id="check-all-days">
                <option value="7">7 days</option>
                <option value="30" selected>30 days</option>
                <option value="90">90 days</option>
              </select>
            </label>
            <button type="button" id="check-all-sources" class="primary" title="Check all enabled sources for new articles">Check all sources</button>
          </div>
        </div>
        <div class="sources-check-feedback">
          <p id="check-all-status" class="muted" role="status" hidden></p>
          <ul id="check-all-results" class="sources-check-results" hidden></ul>
        </div>
      </div>
      ${review_section}
      <section class="custom-source-box" aria-label="Add custom RSS or Atom feed">
        <h2>Add custom RSS/Atom feed</h2>
        <form id="custom-source-form" class="custom-source-form">
          <label>
            Name
            <input id="custom-source-name" type="text" required maxlength="80" placeholder="e.g. CISA Advisories or The DFIR Report" />
          </label>
          <label>
            RSS / Atom URL
            <input id="custom-source-rss" type="url" required placeholder="https://example.com/feed.xml" />
          </label>
          <label>
            Site URL (optional)
            <input id="custom-source-site" type="url" placeholder="https://example.com/" />
          </label>
          <button type="submit" class="primary" id="custom-source-submit">Add feed</button>
        </form>
        <p id="source-feedback" class="muted" role="status" hidden></p>
      </section>
      ${source_groups}
    </main>
  </body>
</html>
