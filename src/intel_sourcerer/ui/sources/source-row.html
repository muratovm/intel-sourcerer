<article class="source-card" title="${source_notes}">
  <h3>${source_name}</h3>
  <p class="source-id muted">${source_id}</p>
  <p class="source-links">${source_links}</p>
  <label class="source-toggle"
    ><input
      type="checkbox"
      data-source="${source_id}"
      aria-label="Enable ${source_name}"
      ${checked_attribute}
    />
    <span class="source-status ${status_class}">${status}</span></label
  >
</article>
