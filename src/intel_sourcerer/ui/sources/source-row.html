<article class="source-card" title="${source_notes}">
  <div>
    <h3>${source_name}</h3>
    <p class="source-health muted">${source_health}</p>
  </div>
  <p class="source-id muted">${source_id}</p>
  <p class="source-links">${source_links}</p>
  <div class="source-controls">
    <select class="source-relevance" data-relevance="${source_id}" aria-label="Relevance rule for ${source_name}">
      <option value="auto" ${relevance_auto}>Keyword filter</option>
      <option value="all" ${relevance_all}>Keep all posts</option>
    </select>
    <button type="button" class="source-check" data-check-source="${source_id}">Check</button>
    ${remove_button}
    <label class="source-toggle"
      ><input
        type="checkbox"
        data-source="${source_id}"
        aria-label="Enable ${source_name}"
        ${checked_attribute}
      />
      <span class="source-status ${status_class}">${status}</span></label
    >
  </div>
</article>
