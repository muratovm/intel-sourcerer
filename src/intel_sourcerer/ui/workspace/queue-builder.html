    <main id="setup" class="queue-builder" hidden>
      <header class="builder-header">
        <div class="brand">
          <img class="brand-icon" src="/brand-icon.png" alt="" />Intel Sourcerer
        </div>
        <nav class="builder-links" aria-label="Main navigation">
          <time id="builder-date" class="muted"></time><a href="/">Home</a
          ><a href="/?view=builder" class="active" aria-current="page"
            >Queue builder</a
          ><a href="/library">Library</a><a href="/sources">Sources</a
          ><a href="/stats">Stats</a>
        </nav>
      </header>
      <div class="builder-columns">
        <section class="discovery-pane">
          <form id="discovery-form" class="discovery-controls">
            <label
              >Source<input
                id="article-source"
                type="text"
                list="source-options"
                placeholder="All sources"
                autocomplete="off"
                aria-label="Source" /><datalist
                id="source-options"
              ></datalist></label
            ><label
              >Article type<select id="article-type">
                <option>All</option>
                <option>Threat research</option>
                <option>Vulnerabilities</option>
                <option>AI misuse</option>
                <option>Incident analysis</option>
              </select></label
            ><label
              >Timeframe<select id="timeframe">
                <option value="1">Last 24 hours</option>
                <option value="3">Last 3 days</option>
                <option value="7">Last 7 days</option>
                <option value="14">Last 14 days</option>
                <option value="30" selected>Last 30 days</option>
                <option value="60">Last 60 days</option>
                <option value="90">Last 90 days</option>
                <option value="180">Last 6 months</option>
                <option value="365">Last year</option>
                <option value="0">All time</option>
              </select></label
            >
            <fieldset class="status-radios">
              <legend>Article status</legend>
              <label
                ><input
                  type="checkbox"
                  name="article-status"
                  value="hide-read"
                />
                Hide read</label
              ><label
                ><input
                  type="checkbox"
                  name="article-status"
                  value="only-noted"
                />
                Noted only</label
              >
            </fieldset>
            <button id="find-latest" class="primary" type="submit">
              Find latest articles
            </button>
          </form>
          <p
            id="discovery-status"
            class="muted"
            role="status"
            aria-live="polite"
          >
            Saved articles · newest first
          </p>
          <div id="result-count" class="muted"></div>
          <div id="discovery-results"></div>
        </section>
        <aside class="queue-pane" aria-label="Build your queue">
          <h2>Your queue <span id="queue-count" class="muted"></span></h2>
          <p class="muted">
            Drag to reorder. Add articles from the left or drop links below.
          </p>
          <ol id="draft-queue"></ol>
          <div
            id="link-drop"
            class="link-drop"
            tabindex="0"
            aria-label="Drop article links here"
          >
            <strong>Drop article links here</strong
            ><span class="muted"
              >Add one or more URLs to build your queue.</span
            >
          </div>
          <form id="link-form" class="link-form">
            <label class="sr-only" for="article-url">Article URL</label
            ><input
              id="article-url"
              type="url"
              placeholder="https://…"
              required
            /><button id="add-link" type="submit">Add link</button>
          </form>
          <p
            id="link-status"
            class="muted"
            role="status"
            aria-live="polite"
          ></p>
          <form id="queue-form">
            <button id="start" class="primary" type="submit" disabled>
              Start reading
            </button>
          </form>
        </aside>
      </div>
    </main>
