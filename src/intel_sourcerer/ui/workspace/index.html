<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="user-id" content="__USER_ID__" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf-token" content="__TOKEN__" />
    <title>Intel Sourcerer</title>
    <link rel="stylesheet" href="/reader.css" />
    <script src="/vendor/katex/katex.min.js" defer></script>
    <script src="/vendor/katex/auto-render.min.js" defer></script>
    <script src="/math.js" defer></script>
    <script src="/reader.js" defer></script>
    <script src="/focus.js" defer></script>
  </head>
  <body>
    <div id="notice" role="alert" hidden></div>
    <!-- include: workspace/home.html -->
    <!-- include: workspace/queue-builder.html -->
    <!-- include: workspace/reading.html -->
    <div id="complete" class="completion-overlay" hidden>
      <section
        class="completion-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="completion-title"
      >
        <div class="brand">
          <img class="brand-icon" src="/brand-icon.png" alt="" />Intel Sourcerer
        </div>
        <p class="eyebrow">QUEUE FINISHED</p>
        <h1 id="completion-title">That’s your queue.</h1>
        <p id="completion-count" class="muted"></p>
        <p class="muted">
          Your notes are saved. Take a break, or choose your next reads.
        </p>
        <button id="new-queue" class="primary">Create new queue</button>
      </section>
    </div>
<dialog
      id="delete-dialog"
      class="lib-dialog"
      aria-labelledby="delete-title"
      aria-describedby="delete-description"
    >
      <h2 id="delete-title">Delete this article?</h2>
      <p id="delete-description">
        The saved article and its notes will be deleted. It will also be removed
        from reading queues and read history.
      </p>
      <p id="delete-error" role="alert" hidden></p>
      <div class="lib-dialog-actions">
        <button id="cancel-delete" type="button" autofocus>Cancel</button
        ><button id="confirm-delete" class="danger" type="button">
          Delete article
        </button>
      </div>
    </dialog>
  </body>
</html>
